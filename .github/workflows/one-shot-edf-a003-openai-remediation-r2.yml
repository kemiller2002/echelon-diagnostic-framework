name: One-shot EDF A003 OpenAI remediation r2 attribution

on:
  push:
    branches:
      - experiment/edf-a003-openai-remediation-r2-ros

permissions:
  contents: write

jobs:
  attribute:
    if: ${{ !contains(github.event.head_commit.message, '[ros-attributed]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Begin ROS research work
        shell: bash
        run: |
          set -euo pipefail
          ./ros add "Remediate OpenAI EX-EDF-2026-A003 cases after Anthropic re-review round 1" --tag edf,research,experiment,review-remediation --priority high
          WORK_ID="$(node -e "const fs=require('fs');const q=JSON.parse(fs.readFileSync('.ros/work/queue.json','utf8'));process.stdout.write(q.items[q.items.length-1].id)")"
          echo "WORK_ID=$WORK_ID" >> "$GITHUB_ENV"
          ./ros work backlog-transition --action ready --id "$WORK_ID" --occurred-at "$(date -u +%Y-%m-%dT%H:%M:%S.000Z)"
          sleep 1
          ./ros work begin --id "$WORK_ID" --occurred-at "$(date -u +%Y-%m-%dT%H:%M:%S.000Z)" --type research

      - name: Import round-2 remediation
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin experiment/edf-a003-openai-remediation-r2:refs/remotes/origin/experiment/edf-a003-openai-remediation-r2
          git checkout origin/experiment/edf-a003-openai-remediation-r2 -- \
            research/experiments/EX-EDF-2026-A003/cases/ST-003.case.json \
            research/experiments/EX-EDF-2026-A003/cases/ST-003.truth.json \
            research/experiments/EX-EDF-2026-A003/cases/ST-005.case.json \
            research/experiments/EX-EDF-2026-A003/cases/ST-005.truth.json \
            research/experiments/EX-EDF-2026-A003/cases/ST-009.case.json \
            research/experiments/EX-EDF-2026-A003/cases/ST-009.truth.json \
            research/experiments/EX-EDF-2026-A003/cases/ST-011.case.json \
            research/experiments/EX-EDF-2026-A003/cases/ST-011.truth.json \
            research/journal/JR-EDF-2026-009.md

      - name: Validate all current OpenAI-authored cases
        shell: bash
        run: |
          set -euo pipefail
          for CASE in ST-001 ST-003 ST-005 ST-007 ST-009 ST-011; do
            node scripts/edf-002-case-author.mjs validate "$CASE"
          done
          node scripts/edf-002-validate.mjs validate
          node --test tests/edf-002-validation.test.mjs tests/edf-002-scoring.test.mjs

      - name: Complete ROS and commit final tree
        shell: bash
        run: |
          set -euo pipefail
          ./ros work complete --id "$WORK_ID" --occurred-at "$(date -u +%Y-%m-%dT%H:%M:%S.000Z)" --evidence research-record=research/journal/JR-EDF-2026-009.md
          ./ros registry build
          rm -f .github/workflows/one-shot-edf-a003-openai-remediation-r2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "research: remediate OpenAI EX-EDF-2026-A003 cases round 2 [ros-attributed]"

      - name: Validate final tree and push
        shell: bash
        run: |
          set -euo pipefail
          export ROS_BASE_REF="48fc7aba4d53af1644c13c8d46566552835666f2"
          ./ros validate
          git push origin HEAD:${GITHUB_REF_NAME}
