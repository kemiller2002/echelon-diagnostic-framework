name: One-shot EDF A003 cryptographic freeze

on:
  push:
    branches:
      - experiment/edf-a003-frozen-v1

permissions:
  contents: write

jobs:
  freeze:
    if: ${{ !contains(github.event.head_commit.message, '[frozen]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Begin ROS freeze work
        shell: bash
        run: |
          set -euo pipefail
          ./ros add "Cryptographically freeze EX-EDF-2026-A003 accepted benchmark" --tag edf,research,experiment,freeze --priority high
          WORK_ID="$(node -e "const fs=require('fs');const q=JSON.parse(fs.readFileSync('.ros/work/queue.json','utf8'));process.stdout.write(q.items[q.items.length-1].id)")"
          echo "WORK_ID=$WORK_ID" >> "$GITHUB_ENV"
          ./ros work backlog-transition --action ready --id "$WORK_ID" --occurred-at "$(date -u +%Y-%m-%dT%H:%M:%S.000Z)"
          sleep 1
          ./ros work begin --id "$WORK_ID" --occurred-at "$(date -u +%Y-%m-%dT%H:%M:%S.000Z)" --type research

      - name: Re-run final pre-freeze gate
        shell: bash
        run: |
          set -euo pipefail
          for id in ST-001 ST-002 ST-003 ST-004 ST-005 ST-006 ST-007 ST-008 ST-009 ST-010 ST-011 ST-012; do
            node scripts/edf-002-case-author.mjs validate "$id"
            node scripts/edf-002-review.mjs validate "$id"
          done
          node scripts/edf-002-validate.mjs freeze
          node --test             tests/edf-002-validation.test.mjs             tests/edf-002-scoring.test.mjs             tests/edf-002-harness.test.mjs
          test ! -e research/experiments/EX-EDF-2026-A003/frozen-files.json
          test ! -d research/experiments/EX-EDF-2026-A003/manual-runs
          test ! -d research/experiments/EX-EDF-2026-A003/runs

      - name: Create and verify cryptographic freeze
        shell: bash
        run: |
          set -euo pipefail
          node scripts/edf-002-freeze.mjs freeze
          node scripts/edf-002-freeze.mjs verify
          MANIFEST="research/experiments/EX-EDF-2026-A003/frozen-files.json"
          MANIFEST_SHA="$(sha256sum "$MANIFEST" | awk '{print $1}')"
          echo "MANIFEST_SHA=$MANIFEST_SHA" >> "$GITHUB_ENV"
          echo "MANIFEST_FILE_COUNT=$(node -e "const f=require('./$MANIFEST');process.stdout.write(String(Object.keys(f.files).length))")" >> "$GITHUB_ENV"

      - name: Write freeze journal
        shell: bash
        run: |
          set -euo pipefail
          cat > research/journal/JR-EDF-2026-012.md <<EOF
          ---
          id: JR-EDF-2026-012
          title: EX-EDF-2026-A003 Cryptographic Freeze
          date: 2026-09-25
          experiment: EX-EDF-2026-A003
          ---

          # Research Journal

          ## Freeze source

          The accepted pre-freeze integration tree was:

          73bbe332082415beb7f3a4f307e84538f2682ee0

          It contains exactly the accepted 12 case/truth pairs and their passing opposite-provider reviews, plus the audited scoring/analyzer harness described in JR-EDF-2026-011.

          ## Freeze operation

          The freeze command was:

          node scripts/edf-002-freeze.mjs freeze

          Immediate verification command:

          node scripts/edf-002-freeze.mjs verify

          Both completed successfully.

          Freeze manifest:

          research/experiments/EX-EDF-2026-A003/frozen-files.json

          Manifest SHA-256:

          $MANIFEST_SHA

          Manifest file count:

          $MANIFEST_FILE_COUNT

          The freeze manifest is write-once: the freeze script refuses replacement if frozen-files.json already exists.

          ## Final pre-freeze gate

          Immediately before freeze:

          - all 12 case-author validators passed;
          - all 12 opposite-provider review validators passed;
          - the complete-case validator passed in freeze mode;
          - validation, scoring and harness regression tests passed;
          - no analyzer manual-runs directory existed;
          - no legacy runs directory existed;
          - no prior freeze manifest existed.

          ## Integrity boundary

          No analyzer execution or analyzer output inspection occurred before this freeze.

          From this freeze onward, the files hashed by frozen-files.json are immutable for EX-EDF-2026-A003. Any hash mismatch invalidates the frozen benchmark and must not be repaired in place.

          Analyzer execution may begin only after this freeze commit is pushed and node scripts/edf-002-freeze.mjs verify succeeds on the final committed tree.
          EOF

      - name: Complete ROS work and commit freeze
        shell: bash
        run: |
          set -euo pipefail
          ./ros work complete --id "$WORK_ID" --occurred-at "$(date -u +%Y-%m-%dT%H:%M:%S.000Z)" --evidence research-record=research/journal/JR-EDF-2026-012.md
          ./ros registry build
          rm -f .github/workflows/one-shot-edf-a003-freeze.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "research: freeze EX-EDF-2026-A003 benchmark [frozen]"

      - name: Verify final committed freeze and push
        shell: bash
        run: |
          set -euo pipefail
          node scripts/edf-002-freeze.mjs verify
          export ROS_BASE_REF="73bbe332082415beb7f3a4f307e84538f2682ee0"
          ./ros validate
          git push origin HEAD:${GITHUB_REF_NAME}
