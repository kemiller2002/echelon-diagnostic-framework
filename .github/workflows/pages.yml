name: Publish to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node for repository validation
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install pinned Forma presentation assets
        # Keep the tag equal to the version in forma.lock.
        uses: kemiller2002/forma/actions/install-presentation@v0.13.0
        with:
          lock: forma.lock

      - name: Check local CSS against the Forma policy
        uses: kemiller2002/forma/actions/check-site-css@v0.13.0
        with:
          files: static-site/styles.css
          forma: static-site/assets/forma/forma-echelon-marketing.css

      - name: Run repository integrity tests
        run: |
          node --test
          node scripts/validate-repository.mjs
          node scripts/edf-benchmark.mjs validate

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare static site
        run: |
          cp public/og.png static-site/og.png
          touch static-site/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: static-site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
