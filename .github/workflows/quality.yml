name: Repository quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run integrity tests
        run: |
          node --test
          node scripts/validate-repository.mjs
          node scripts/edf-benchmark.mjs validate
