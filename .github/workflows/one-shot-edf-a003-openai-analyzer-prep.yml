name: One-shot EDF A003 OpenAI analyzer preparation

on:
  push:
    branches:
      - experiment/edf-a003-analyzer-openai

permissions:
  contents: write

jobs:
  prepare:
    if: ${{ !contains(github.event.head_commit.message, '[analyzer-prepared]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify frozen benchmark
        run: |
          set -euo pipefail
          node scripts/edf-002-freeze.mjs verify

      - name: Begin ROS preparation work
        shell: bash
        run: |
          set -euo pipefail
          ./ros add "Prepare blinded OpenAI analyzer slot for EX-EDF-2026-A003" --tag edf,research,experiment,analyzer --priority high
          WORK_ID="$(node -e "const fs=require('fs');const q=JSON.parse(fs.readFileSync('.ros/work/queue.json','utf8'));process.stdout.write(q.items[q.items.length-1].id)")"
          echo "WORK_ID=$WORK_ID" >> "$GITHUB_ENV"
          ./ros work backlog-transition --action ready --id "$WORK_ID" --occurred-at "$(date -u +%Y-%m-%dT%H:%M:%S.000Z)"
          sleep 1
          ./ros work begin --id "$WORK_ID" --occurred-at "$(date -u +%Y-%m-%dT%H:%M:%S.000Z)" --type research

      - name: Prepare deterministic run plan
        shell: bash
        run: |
          set -euo pipefail
          node scripts/edf-002-analyzer.mjs prepare --slot openai
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const p='research/experiments/EX-EDF-2026-A003/manual-runs/openai/run-plan.json';
          const plan=JSON.parse(fs.readFileSync(p,'utf8'));
          if(plan.experiment!=='EX-EDF-2026-A003') throw new Error('experiment mismatch');
          if(plan.slot!=='openai') throw new Error('slot mismatch');
          if(plan.runs.length!==24) throw new Error('expected 24 runs');
          const ids=new Set(plan.runs.map(x=>x.runId));
          if(ids.size!==24) throw new Error('duplicate run IDs');
          for(const c of ['neutral','construct']){
            if(plan.runs.filter(x=>x.condition===c).length!==12) throw new Error('condition count mismatch '+c);
          }
          console.log(JSON.stringify({ok:true,runs:24,neutral:12,construct:12},null,2));
          NODE
          test ! -e research/experiments/EX-EDF-2026-A003/manual-runs/openai/executor.json
          test ! -d research/experiments/EX-EDF-2026-A003/manual-runs/openai/runs

      - name: Write preparation journal
        shell: bash
        run: |
          set -euo pipefail
          PLAN="research/experiments/EX-EDF-2026-A003/manual-runs/openai/run-plan.json"
          PLAN_SHA="$(sha256sum "$PLAN" | awk '{print $1}')"
          cat > research/journal/JR-EDF-2026-013.md <<EOF
          ---
          id: JR-EDF-2026-013
          title: EX-EDF-2026-A003 OpenAI Analyzer Slot Preparation
          date: 2026-09-25
          experiment: EX-EDF-2026-A003
          ---

          # Research Journal

          ## Frozen source

          Analyzer branch source:
          9285d5c26a4a61515a91aa22af5b1d09f2d64b14

          The frozen manifest verified successfully before run-plan generation.

          ## Slot

          Analyzer slot: openai

          The deterministic plan was generated by the frozen analyzer harness:

          node scripts/edf-002-analyzer.mjs prepare --slot openai

          Run count: 24
          Neutral runs: 12
          Construct runs: 12

          Run-plan SHA-256:
          $PLAN_SHA

          ## Blinding boundary

          No executor is bound yet.
          No model has been selected or invoked.
          No prompts were sent to an analyzer.
          No analyzer outputs exist.
          Truth and review artifacts must not be shown to the future blinded analyzer session.

          The next operation on this branch is executor binding in a clean OpenAI analyzer session, followed by the frozen next/record/finish protocol.
          EOF

      - name: Complete ROS and commit prepared branch
        shell: bash
        run: |
          set -euo pipefail
          ./ros work complete --id "$WORK_ID" --occurred-at "$(date -u +%Y-%m-%dT%H:%M:%S.000Z)" --evidence research-record=research/journal/JR-EDF-2026-013.md
          ./ros registry build
          rm -f .github/workflows/one-shot-edf-a003-openai-analyzer-prep.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "research: prepare EX-EDF-2026-A003 OpenAI analyzer slot [analyzer-prepared]"

      - name: Final verification and push
        shell: bash
        run: |
          set -euo pipefail
          node scripts/edf-002-freeze.mjs verify
          export ROS_BASE_REF="9285d5c26a4a61515a91aa22af5b1d09f2d64b14"
          ./ros validate
          git push origin HEAD:${GITHUB_REF_NAME}
